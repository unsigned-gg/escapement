image:
  repository: harbor.unsigned.gg/platform/escapement-serve
  tag: "v1.1.1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 7858

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Escapement core config (maps to escapement.toml)
escapement:
  defaults:
    provider: gateway
    model: llm/glm-5.2
  verify:
    command: "cargo fmt --check --all && cargo clippy --all-targets -- -D warnings && cargo test"
  budget:
    maxTokensPerRun: 200000
  observability:
    otlpEndpoint: http://localhost:4318/v1/traces

# Concurrency limits per capability
concurrency:
  build: 5
  review: 3

# Priority lanes
lanes:
  - name: critical
    weight: 4
  - name: high
    weight: 3
  - name: normal
    weight: 2
  - name: low
    weight: 1
  - name: background
    weight: 1

# Queue persistence
persistence:
  enabled: true
  storageClass: longhorn
  size: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

nodeSelector: {}
tolerations: []
affinity: {}

replicaCount: 1  # single-writer — the dispatch queue is not horizontally scalable

podDisruptionBudget:
  enabled: true
  minAvailable: 1  # single replica → PDB prevents voluntary eviction

networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: traefik
      ports:
        - protocol: TCP
          port: 7858
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: soma
      ports:
        - protocol: TCP
          port: 7858
