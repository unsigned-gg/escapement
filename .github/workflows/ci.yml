name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ci-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  edge:
    # ubuntu-latest, not self-hosted: ARC scale-set runners carry only their
    # scale-set name as a label, so bare `self-hosted` never matches them —
    # this job queued forever once the repo went public (public-repo-ci group
    # serves ci-rust/reverie-ug only). The edge typecheck needs no cluster
    # access; GitHub-hosted is correct and egress-safe.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge/worker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: edge/worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
