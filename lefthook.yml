# Conventional Commits + gitleaks + affected-CI pre-push gate (federated standard).
# commit-stage = light + fast; pre-push = the affected CI gate ("green before push
# = no CI surprise"). Skip: LEFTHOOK=0.
#
# No moon/proto toolchain here — escapement is a Cargo workspace, so the pre-push
# gate runs cargo across the workspace (mirrors ci.yml's rust job: fmt + clippy +
# test). Per adopt-standards.md §C: fail-soft on absent tooling; CI is the hard
# backstop.
commit-msg:
  commands:
    conventional:
      run: |
        head -1 {1} | grep -qE '^(feat|fix|perf|refactor|docs|test|ci|build|infra|security|style|chore)(\(.+\))?!?: .+' \
          || { echo "commit-msg must be Conventional Commits: <type>(scope): <desc>"; exit 1; }

pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --redact --no-banner || echo "gitleaks not installed — CI will enforce"

pre-push:
  commands:
    affected-ci:
      run: cargo test --all-targets
